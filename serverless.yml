service: auth-service
frameworkVersion: '3'
useDotenv: true

plugins:
  # serverless-offline is intentionally absent: local development runs through
  # src/local-server.ts, and loading both plugins makes Serverless v3 process
  # the same plugin class twice and die with "Cannot redefine property:
  # _serverlessExternalPluginName".
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, 'us-east-1'}
  memorySize: 256
  timeout: 10
  environment:
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_TTL_SECONDS: ${env:JWT_TTL_SECONDS, '86400'}
    ADMIN_API_KEY: ${env:ADMIN_API_KEY}
    CUSTOMER_LOOKUP_URL: ${env:CUSTOMER_LOOKUP_URL}

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: linked
    target: node22
    platform: node
    exclude:
      - aws-sdk

functions:
  authenticateCustomer:
    handler: src/handlers/authenticate-customer.handler
    events:
      - httpApi:
          method: POST
          path: /auth
  authenticateAdmin:
    handler: src/handlers/authenticate-admin.handler
    events:
      - httpApi:
          method: POST
          path: /auth/admin
