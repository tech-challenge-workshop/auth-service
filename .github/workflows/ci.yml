name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:check
      - run: pnpm test:ci
      - run: pnpm build

  docker:
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC token exchanged for AWS credentials. There is no
      # long-lived access key anywhere in this workflow.
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'tech-challenge-dev-eks' }}
      NAMESPACE: tech-challenge
    steps:
      # The cluster is created and destroyed around demos, so a missing role
      # means "no cluster right now", not a failure. Skipping keeps main green.
      - name: Check whether a cluster is configured
        id: guard
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the kubeconfig
        if: steps.guard.outputs.enabled == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Roll out the image built by this run
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          kubectl -n "$NAMESPACE" set image deployment/auth-service \
            app="ghcr.io/tech-challenge-workshop/auth-service:${TAG}"
          # Fails the job if the new pods never become ready, so a broken image
          # surfaces here instead of silently staying in ImagePullBackOff.
          kubectl -n "$NAMESPACE" rollout status deployment/auth-service --timeout=5m
